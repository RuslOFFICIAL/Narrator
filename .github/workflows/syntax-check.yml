name: Syntax Check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Check JS syntax with 'node -c'.
        run: |
          set -euo pipefail
          mapfile -d '' js_files < <(
            find . -maxdepth 3 -type f -name '*.js' \
              ! -path './node_modules/*' \
              ! -path './.git/*' \
              -print0
          )
          if [ "${#js_files[@]}" -gt 0 ]; then
            printf '%s\0' "${js_files[@]}" | xargs -0 -n 1 node -c
          fi
          echo "All JavaScript files passed 'node -c'."

      - name: Check JS undeclared and unused variables.
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";

            const ignoreDirs = new Set(["node_modules", ".git", "lores", "data", "logs", "sounds"]);
            const jsFiles = [];

            function walk(dir, depth = 0) {
              if (depth > 3) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (ignoreDirs.has(entry.name)) continue;
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(fullPath, depth + 1);
                else if (entry.isFile() && entry.name.endsWith(".js")) jsFiles.push(fullPath);
              }
            }

            walk(".");

            const allowedGlobals = new Set([
              "require", "module", "exports", "__dirname", "__filename", "process",
              "console", "Buffer", "setTimeout", "clearTimeout", "setInterval", "clearInterval",
              "setImmediate", "clearImmediate", "Promise", "Map", "Set", "Array", "Object",
              "String", "Number", "Boolean", "RegExp", "Error", "JSON", "Math", "Date",
              "BigInt", "Symbol", "WeakMap", "WeakSet", "URL", "URLSearchParams", "Intl",
              "NaN", "Infinity", "undefined", "null", "true", "false"
            ]);

            let problems = 0;

            for (const file of jsFiles) {
              const code = fs.readFileSync(file, "utf8");
              // Strip strings and comments to reduce false positives.
              const stripped = code
                .replace(/\/\*[\s\S]*?\*\//g, "")
                .replace(/\/\/[^\n]*/g, "")
                .replace(/`(?:\\.|[^`])*`/g, "\"\"")
                .replace(/"(?:\\.|[^"])*"/g, "\"\"")
                .replace(/'(?:\\.|[^'])*'/g, "\"\"");

              const declared = new Set(allowedGlobals);
              for (const m of stripped.matchAll(/\b(?:const|let|var|function|class)\s+([A-Za-z_$][A-Za-z0-9_$]*)/g)) {
                declared.add(m[1]);
              }
              // Catch destructured names.
              for (const m of stripped.matchAll(/(?:const|let|var)\s*\{([^}]+)\}/g)) {
                for (const part of m[1].split(",")) {
                  const clean = part.trim();
                  if (!clean) continue;
                  const aliasMatch = clean.match(/:\s*([A-Za-z_$][A-Za-z0-9_$]*)/);
                  const nameMatch = (aliasMatch ? aliasMatch[1] : clean.split("=")[0]).trim().replace(/^\.\.\./, "");
                  if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(nameMatch)) {
                    declared.add(nameMatch);
                  }
                }
              }

              // Catch standalone identifiers not preceded by "." or ":" or followed by ":".
              const tokenRegex = /(?<![.\w$])([A-Za-z_$][A-Za-z0-9_$]*)(?![\w$:])/g;
              const counts = new Map();
              for (const m of stripped.matchAll(tokenRegex)) {
                const name = m[1];
                counts.set(name, (counts.get(name) ?? 0) + 1);
                if (!declared.has(name) && !/^(if|else|for|while|do|switch|case|default|break|continue|return|try|catch|finally|throw|new|typeof|void|in|of|async|await|import|from|export)$/.test(name)) {
                  console.warn(`[WARN] Possible undeclared identifier "${name}" in ${file}`);
                  problems++;
                }
              }

              for (const [name, count] of counts.entries()) {
                if (declared.has(name) && !allowedGlobals.has(name) && count === 1) {
                  console.warn(`[WARN] Possible unused declaration "${name}" in ${file}`);
                }
              }
            }

            if (problems > 0) {
              process.exitCode = 1;
            }
          '

      - name: Check SH syntax with 'bash -n'.
        run: |
          set -euo pipefail
          mapfile -d '' sh_files < <(
            find . -maxdepth 3 -type f -name '*.sh' \
              ! -path './node_modules/*' \
              ! -path './.git/*' \
              -print0
          )
          if [ "${#sh_files[@]}" -gt 0 ]; then
            printf '%s\0' "${sh_files[@]}" | xargs -0 -n 1 bash -n
          fi
          echo "All shell scripts passed 'bash -n'."
